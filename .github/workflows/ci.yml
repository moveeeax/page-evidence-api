name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -trimpath -o bin/pev ./cmd/pev

      - name: test
        run: go test -race -count=1 ./...

      # The verifier's whole promise is that a bundle checks out offline on a
      # machine that has never seen this service. CI is that machine.
      - name: verify the example bundle
        run: ./bin/pev verify testdata/bundles/valid -tsa-roots testdata/tsa-test-root.pem -require-timestamp

      - name: the tampered bundle must fail
        run: |
          if ./bin/pev verify testdata/bundles/tampered -tsa-roots testdata/tsa-test-root.pem; then
            echo "the tampered bundle verified; the verifier is broken"
            exit 1
          fi

      # The same bundle, checked with nothing but coreutils and OpenSSL.
      - name: the openssl kit verifies without pev
        run: |
          ./bin/pev export-openssl testdata/bundles/valid -out "$RUNNER_TEMP/kit"
          cd "$RUNNER_TEMP/kit"
          openssl version
          sha256sum -c artefacts.sha256
          openssl ts -verify -data manifest.json -in timestamp.tsr \
            -untrusted tsa-untrusted.pem -CAfile "$GITHUB_WORKSPACE/testdata/tsa-test-root.pem"
